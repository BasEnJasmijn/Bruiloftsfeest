<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beheer — Aanmeldingen Jasmijn &amp; Bas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #5b8bb2;
    --accent-dark: #47708f;
    --accent-soft: #dcebf6;
    --ink: #2f3e4d;
    --ink-soft: #64788c;
    --paper: #f2f9fe;
    --line: #d7e6f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito Sans", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    padding: 40px 16px 72px;
  }
  main { max-width: 1080px; margin: 0 auto; }
  h1 {
    font-family: "Playfair Display", serif;
    font-size: clamp(24px, 4vw, 32px);
    margin: 0 0 6px;
  }
  .sub { color: var(--ink-soft); margin: 0 0 24px; }
  .login {
    max-width: 420px;
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 50px -30px rgba(93, 63, 44, .35);
  }
  .login label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .login input, .login button, .btn {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 10px 14px;
  }
  .login input { width: 100%; margin-bottom: 12px; background: #fff; }
  .btn {
    font-weight: 700;
    cursor: pointer;
    background: var(--accent);
    border-color: var(--accent-dark);
    color: #fff;
    text-decoration: none;
    display: inline-block;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent-dark);
  }
  .btn:disabled { opacity: .6; cursor: wait; }
  #loginStatus { color: #a33b2e; font-size: 14px; font-weight: 600; min-height: 1em; margin: 8px 0 0; }
  #dashboard { display: none; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stat .n { font-family: "Playfair Display", serif; font-size: 28px; font-weight: 700; }
  .stat .t { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
  .tablewrap {
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: #f7efe8; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  td.ja { color: #2f7d4f; font-weight: 700; }
  td.nee { color: #a33b2e; font-weight: 700; }
  .empty { padding: 28px; text-align: center; color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <h1>Beheer — aanmeldingen Jasmijn &amp; Bas</h1>
  <p class="sub">Overzicht van alle ingediende formulieren, rechtstreeks uit de Google Sheet.</p>

  <section id="loginSection" class="login">
    <label for="code">Beheercode</label>
    <input type="password" id="code" autocomplete="current-password" placeholder="Vul de beheercode in">
    <button class="btn" id="loadBtn">Aanmeldingen ophalen</button>
    <p id="loginStatus"></p>
  </section>

  <section id="dashboard">
    <div class="toolbar">
      <button class="btn" id="downloadBtn">⬇ Download als CSV (Excel)</button>
      <button class="btn secondary" id="refreshBtn">↺ Verversen</button>
      <a class="btn secondary" id="sheetLink" href="#" target="_blank" rel="noopener">Open de Google Sheet</a>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Tijdstip</th>
            <th>Naam</th>
            <th>Komt</th>
            <th>Gast mee</th>
            <th>Naam gast</th>
            <th>Dieetwensen</th>
            <th>Zegt iets</th>
            <th>Toelichting</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="emptyMsg">Nog geen aanmeldingen ontvangen.</div>
    </div>
  </section>
</main>

<script>
  const SCRIPT_URL = "PLAK_HIER_JE_APPS_SCRIPT_WEB_APP_URL";
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbz5yOL6pvMEPrLlOn9sUhBlBj2PtjdK5tE0JaM5D96n8hUUP847G8T3Imrr33nKqwRx/exec";
  const MAX_PERSONEN = 55;

  let huidigeRijen = [];

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginStatus = document.getElementById("loginStatus");
  const codeInput = document.getElementById("code");

  async function laadAanmeldingen() {
    const code = codeInput.value.trim();
    if (!code) {
      loginStatus.textContent = "Vul eerst de beheercode in.";
      return;
    }
    loginStatus.textContent = "";
    document.getElementById("loadBtn").disabled = true;
    try {
      const url = `${SCRIPT_URL}?action=list&passcode=${encodeURIComponent(code)}`;
      const res = await fetch(url);
      const json = await res.json();
      if (!json.ok) {
        loginStatus.textContent = json.error || "Ophalen is mislukt.";
        return;
      }
      huidigeRijen = json.rows || [];
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      render();
    } catch (err) {
      loginStatus.textContent = "Kan de aanmeldingen niet ophalen. Controleer de Apps Script-URL en of de web-app is gepubliceerd.";
    } finally {
      document.getElementById("loadBtn").disabled = false;
    }
  }

  document.getElementById("loadBtn").addEventListener("click", laadAanmeldingen);
  codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") laadAanmeldingen(); });
  document.getElementById("refreshBtn").addEventListener("click", laadAanmeldingen);

  const als = (v) => (v === undefined || v === null) ? "" : String(v);

  function render() {
    const stats = document.getElementById("stats");
    const aanwezig = huidigeRijen.filter(r => r.komt === "Ja").length;
    const afwezig = huidigeRijen.filter(r => r.komt === "Nee").length;
    const gasten = huidigeRijen.filter(r => r.gastMee === "Ja").length;
    const sprekers = huidigeRijen.filter(r => r.zegtIets === "Ja").length;
    const vrije = Math.max(0, MAX_PERSONEN - (aanwezig + gasten));
    stats.innerHTML = `
      <div class="stat"><div class="n">${aanwezig}</div><div class="t">Personen aanwezig</div></div>
      <div class="stat"><div class="n">${gasten}</div><div class="t">Nemen iemand mee</div></div>
      <div class="stat"><div class="n">${sprekers}</div><div class="t">Willen wat zeggen</div></div>
      <div class="stat"><div class="n">${afwezig}</div><div class="t">Komen niet</div></div>
      <div class="stat"><div class="n">${vrije} van ${MAX_PERSONEN}</div><div class="t">Vrije plekken</div></div>`;
    
    const tbody = document.getElementById("rows");
    document.getElementById("emptyMsg").style.display = huidigeRijen.length ? "none" : "block";
    tbody.innerHTML = huidigeRijen.map(r => `
      <tr>
        <td>${escapeHtml(als(r.tijdstip))}</td>
        <td><strong>${escapeHtml(als(r.naam))}</strong></td>
        <td class="${r.komt === 'Ja' ? 'ja' : 'nee'}">${escapeHtml(als(r.komt))}</td>
        <td>${escapeHtml(als(r.gastMee))}</td>
        <td>${escapeHtml(als(r.naamGast))}</td>
        <td>${escapeHtml(als(r.dieetwensen))}</td>
        <td>${r.zegtIets === "Ja" ? '<strong>Ja</strong>' : 'Nee'}</td>
        <td>${escapeHtml(als(r.toelichting))}</td>
      </tr>`).join("");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  document.getElementById("downloadBtn").addEventListener("click", () => {
    if (!huidigeRijen.length) {
      alert("Er zijn nog geen aanmeldingen om te downloaden.");
      return;
    }
    const header = ["Tijdstip", "Naam", "Komt", "Gast meegenomen", "Naam gast", "Dieetwensen", "Iets vertellen", "Toelichting"];
    const regels = [header].concat(huidigeRijen.map(r => [
      als(r.tijdstip), als(r.naam), als(r.komt), als(r.gastMee), als(r.naamGast),
      als(r.dieetwensen), als(r.zegtIets), als(r.toelichting)
    ]));
    const csv = regels.map(regel => regel.map(csvVeld).join(";")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "aanmeldingen-jasmijn-en-bas.csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  });

  function csvVeld(waarde) {
    const s = String(waarde);
    if (/[;"\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  if (SHEET_URL && !SHEET_URL.startsWith("PLAK_HIER")) {
    document.getElementById("sheetLink").href = SHEET_URL;
  } else {
    document.getElementById("sheetLink").style.display = "none";
  }
</script>
</body>
</html>
