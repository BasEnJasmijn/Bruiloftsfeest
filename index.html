<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.S.V.P. — Bruiloftsfeest van Jasmijn &amp; Bas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #b76e62;
    --accent-dark: #96534a;
    --ink: #3d3229;
    --ink-soft: #7a6c60;
    --paper: #fdfaf5;
    --line: #e7ddd2;
    --field: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, #f6e3d8 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #f1e6dd 0%, transparent 55%),
      var(--paper);
    display: flex;
    justify-content: center;
    padding: 40px 16px 72px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: #fffdf9;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 44px 40px 36px;
    box-shadow: 0 24px 60px -30px rgba(93, 63, 44, .35);
  }
  header { text-align: center; margin-bottom: 30px; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: "Playfair Display", serif;
    font-size: clamp(30px, 6vw, 42px);
    margin: 0 0 12px;
    line-height: 1.15;
  }
  h1 .amp { color: var(--accent); font-style: italic; }
  .meta { color: var(--ink-soft); margin: 0; font-size: 15px; }
  .meta .dot { margin: 0 7px; color: var(--accent); }
  form { display: flex; flex-direction: column; gap: 22px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  label, .group > .label {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .01em;
  }
  .label .req { color: var(--accent); }
  .hint { color: var(--ink-soft); font-size: 13px; margin: 0; }
  input[type="text"], textarea {
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  fieldset {
    border: 0;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .choice { position: relative; flex: 1 1 180px; }
  .choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .choice span {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--field);
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    transition: all .15s ease;
  }
  .choice input:checked + span {
    background: var(--accent);
    border-color: var(--accent-dark);
    color: #fff;
  }
  .choice input:focus-visible + span { outline: 2px solid var(--accent-dark); outline-offset: 2px; }
  .sub { padding-left: 18px; border-left: 2px solid var(--line); margin-left: 4px; }
  .hidden { display: none; }
  button[type="submit"] {
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
    margin-top: 4px;
  }
  button[type="submit"]:hover { background: var(--accent-dark); transform: translateY(-1px); }
  button[type="submit"]:disabled { opacity: .6; cursor: wait; transform: none; }
  #formStatus { display: none; font-size: 14px; font-weight: 600; margin: 0; }
  #formStatus.error { display: block; color: #a33b2e; }
  #formStatus.info { display: block; color: var(--ink-soft); }
  #successPanel {
    display: none;
    text-align: center;
    padding: 26px 10px 8px;
  }
  #successPanel h2 {
    font-family: "Playfair Display", serif;
    font-size: 26px;
    margin: 0 0 10px;
  }
  #successPanel p { color: var(--ink-soft); margin: 0 auto; max-width: 42ch; }
  footer {
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px dashed var(--line);
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  @media (max-width: 480px) {
    .card { padding: 30px 22px 26px; }
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <p class="eyebrow">Wij gaan trouwen &nbsp;♡</p>
    <h1>Jasmijn <span class="amp">&amp;</span> Bas</h1>
    <p class="meta">zaterdag 29 mei 2027<span class="dot">•</span>Bunnik</p>
  </header>

  <form id="rsvpForm" novalidate>
    <div class="group">
      <label for="naam">Je naam <span class="req">*</span></label>
      <input type="text" id="naam" name="naam" autocomplete="name" placeholder="Voor- en achternaam" required>
    </div>

    <div class="group">
      <span class="label">Kom je naar ons feest? <span class="req">*</span></span>
      <fieldset id="komtField">
        <label class="choice">
          <input type="radio" name="komt" value="ja" required>
          <span>Ja, ik ben erbij! 🎉</span>
        </label>
        <label class="choice">
          <input type="radio" name="komt" value="nee" required>
          <span>Helaas, ik kan niet</span>
        </label>
      </fieldset>
    </div>

    <div id="komendeDetails" class="group hidden">
      <span class="label">Neem je een partner of gast mee?</span>
      <fieldset>
        <label class="choice">
          <input type="radio" name="gastMee" value="nee" checked>
          <span>Nee, ik kom alleen</span>
        </label>
        <label class="choice">
          <input type="radio" name="gastMee" value="ja">
          <span>Ja, met z'n tweeën</span>
        </label>
      </fieldset>
      <div class="sub">
        <div class="group hidden" id="gastNaamGroep">
          <label for="naamGast">Naam van je gast</label>
          <input type="text" id="naamGast" name="naamGast" placeholder="Naam van je partner of gast">
        </div>
      </div>
    </div>

    <div id="dieetGroep" class="group hidden">
      <label for="dieetwensen">Dieetwensen of allergieën</label>
      <textarea id="dieetwensen" name="dieetwensen" placeholder="Bijv. vegetarisch, glutenvrij, notenallergie…"></textarea>
    </div>

    <div id="sprekenGroep" class="group hidden">
      <span class="label">Wil je graag iets zeggen op het feest?</span>
      <fieldset>
        <label class="choice">
          <input type="radio" name="zegtIets" value="ja">
          <span>Ja, graag!</span>
        </label>
        <label class="choice">
          <input type="radio" name="zegtIets" value="nee" checked>
          <span>Liever niet</span>
        </label>
      </fieldset>
      <div class="sub">
        <div class="group hidden" id="zegtkstGroep">
          <label for="toelichting">Wat wil je vertellen?</label>
          <textarea id="toelichting" name="toelichting" placeholder="Bijv. een toast, een verhaal, een liedje… Vertel kort waar het over gaat."></textarea>
        </div>
      </div>
    </div>

    <button type="submit" id="submitBtn">Aanmelding versturen</button>
    <p id="formStatus" role="status" aria-live="polite"></p>
  </form>

  <div id="successPanel">
    <h2>Bedankt! 🎊</h2>
    <p id="successText">Je aanmelding is verstuurd.</p>
  </div>

  <footer>Vragen? Mail ons dan gerust. We kijken uit naar je reactie!</footer>
</main>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjmdQuemM1PWCHK3jREfg7PhTMGTLMUvZ1JNzuMAwOzBmDmaFawKmsol5Xy6ProxeyHw/exec";

  const form = document.getElementById("rsvpForm");
  const successPanel = document.getElementById("successPanel");
  const successText = document.getElementById("successText");
  const formStatus = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");

  function updateVisibility() {
    const komtJa = form.elements.komt.value === "ja";
    const gastJa = form.elements.gastMee.value === "ja";
    const zegtJa = form.elements.zegtIets.value === "ja";

    document.getElementById("komendeDetails").classList.toggle("hidden", !komtJa);
    document.getElementById("dieetGroep").classList.toggle("hidden", !komtJa);
    document.getElementById("sprekenGroep").classList.toggle("hidden", !komtJa);
    document.getElementById("gastNaamGroep").classList.toggle("hidden", !(komtJa && gastJa));
    document.getElementById("zegtkstGroep").classList.toggle("hidden", !(komtJa && zegtJa));
  }

  form.addEventListener("change", updateVisibility);

  function setStatus(text, kind) {
    formStatus.textContent = text;
    formStatus.className = kind || "";
  }

  function validationError() {
    if (!form.elements.naam.value.trim()) return "Vul je naam in.";
    if (form.elements.komt.value === "ja" && form.elements.gastMee.value === "ja" && !form.elements.naamGast.value.trim()) {
      return "Vul de naam van je gast in.";
    }
    return null;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = validationError();
    if (error) {
      setStatus(error, "error");
      return;
    }
    if (!SCRIPT_URL || SCRIPT_URL.startsWith("PLAK_HIER")) {
      setStatus("De pagina is nog niet gekoppeld aan het formulier-register (zie de instructies).", "error");
      return;
    }

    const komtJa = form.elements.komt.value === "ja";
    const data = {
      naam: form.elements.naam.value.trim(),
      komt: komtJa ? "Ja" : "Nee",
      gastMee: komtJa && form.elements.gastMee.value === "ja" ? "Ja" : "Nee",
      naamGast: komtJa && form.elements.gastMee.value === "ja" ? form.elements.naamGast.value.trim() : "",
      dieetwensen: komtJa ? form.elements.dieetwensen.value.trim() : "",
      zegtIets: komtJa && form.elements.zegtIets.value === "ja" ? "Ja" : "Nee",
      toelichting: komtJa && form.elements.zegtIets.value === "ja" ? form.elements.toelichting.value.trim() : ""
    };

    submitBtn.disabled = true;
    setStatus("Je aanmelding wordt verstuurd…", "info");

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      form.style.display = "none";
      successText.textContent = komtJa
        ? "Je staat op de gastenlijst. We zoeken je op 29 mei in Bunnik! 💐"
        : "Wat jammer dat je niet kunt komen — bedankt voor het laten weten!";
      successPanel.style.display = "block";
    } catch (err) {
      submitBtn.disabled = false;
      setStatus("Er ging iets mis bij het versturen. Probeer het nog een keer.", "error");
    }
  });
</script>
</body>
</html>
